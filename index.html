<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Калькулятор КБЖУ</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <header><h1>Здоровое Питание: Калькулятор</h1></header>
    <nav>
        <ul>
            <li><a href="index.html" class="active">🧮 Калькулятор</a></li>
            <li><a href="diary.html">📝 Дневник</a></li>
            <li><a href="products.html">🥗 Продукты</a></li>
            <li><a href="stats.html">📊 Статистика</a></li>
        </ul>
    </nav>
    <main>
        <h2>Расчёт вашей нормы калорий</h2>
        <p>Введите данные для точного расчёта по формуле Миффлина-Сан Жеора.</p>
        
        <form id="calc-form">
            <label for="gender">Ваш пол:</label>
            <select id="gender">
                <option value="male">Мужской</option>
                <option value="female">Женский</option>
            </select>

            <label for="weight">Вес (кг):</label>
            <input type="number" id="weight" placeholder="Например: 70" required min="30" max="300">
            
            <label for="height">Рост (см):</label>
            <input type="number" id="height" placeholder="Например: 175" required min="100" max="250">
            
            <label for="age">Возраст (лет):</label>
            <input type="number" id="age" placeholder="Например: 25" required min="10" max="100">

            <label for="activity">Уровень активности:</label>
            <select id="activity">
                <option value="1.2">Минимальный (сидячая работа)</option>
                <option value="1.375">Легкий (тренировки 1-3 раза в неделю)</option>
                <option value="1.55">Средний (тренировки 3-5 раз в неделю)</option>
                <option value="1.725">Высокий (тренировки 6-7 раз в неделю)</option>
                <option value="1.9">Экстремальный (тяжелый физ. труд)</option>
            </select>

            <label for="goal">Ваша цель:</label>
            <select id="goal">
                <option value="lose">Похудение (-20%)</option>
                <option value="maintain" selected>Поддержание веса</option>
                <option value="gain">Набор массы (+15%)</option>
            </select>
            
            <button type="submit">Рассчитать норму</button>
        </form>

        <div id="result" style="display:none; margin-top: 20px;">
            <h3 style="margin-top:0; color:var(--accent);">Ваша суточная норма:</h3>
            <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; text-align: center;">
                <div style="flex: 1; min-width: 100px;">
                    <span style="font-size: 2rem; font-weight: bold; color: var(--accent);" id="res-cal">0</span><br><small>ккал</small>
                </div>
                <div style="flex: 1; min-width: 100px;">
                    <span style="font-size: 1.5rem; font-weight: bold;" id="res-prot">0</span> г<br><small>Белки</small>
                </div>
                <div style="flex: 1; min-width: 100px;">
                    <span style="font-size: 1.5rem; font-weight: bold;" id="res-fat">0</span> г<br><small>Жиры</small>
                </div>
                <div style="flex: 1; min-width: 100px;">
                    <span style="font-size: 1.5rem; font-weight: bold;" id="res-carb">0</span> г<br><small>Углеводы</small>
                </div>
            </div>
        </div>
    </main>
    <footer><p>© 2026 Трекер Здорового Питания</p></footer>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Переключить тему"><span id="theme-icon"></span></button>
    <script src="js/main.js"></script>
    <script src="js/calculator.js"></script>
</body>
</html>
